# Build the site, run the pre-publish safety grep, deploy to GitHub Pages.
# Every action is pinned to a full commit SHA (tag in the comment).
# Needs: repository secret SAFETY_PRIVATE_PATTERNS (the private patterns file, class<TAB>ERE lines)
# and Settings > Pages > Source = GitHub Actions.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install pinned dev dependencies
        run: npm ci

      - name: Set SITE_URL from the Pages base URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SITE_URL="${BASE_URL%/}/"
          if [ -z "$BASE_URL" ] || [ "$SITE_URL" = "https://example.invalid/cc-orchestra-site/" ]; then
            echo "SITE_URL is empty or the local placeholder: '$SITE_URL'" >&2; exit 1
          fi
          if ! printf '%s' "$SITE_URL" | grep -Eq '^https://[a-z0-9-]+\.github\.io/[A-Za-z0-9._-]+/$'; then
            echo "SITE_URL is not a Pages project URL: '$SITE_URL'" >&2; exit 1
          fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Safety grep (built site and repository source)
        env:
          PRIVATE_PATTERNS: ${{ secrets.SAFETY_PRIVATE_PATTERNS }}
        run: |
          umask 077
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          if [ -z "$PRIVATE_PATTERNS" ]; then
            echo "secret SAFETY_PRIVATE_PATTERNS is not set" >&2; exit 1
          fi
          printf '%s\n' "$PRIVATE_PATTERNS" > "$f"
          rc=0
          ./safety-grep.sh dist --require-private --private "$f" --redact --allow "$SITE_URL" --allow-count 8 || rc=$?
          [ $rc -eq 0 ] || { echo "safety-grep dist failed (exit $rc)" >&2; exit 1; }
          rc=0
          ./safety-grep.sh . --source-mode --require-private --private "$f" --redact || rc=$?
          [ $rc -eq 0 ] || { echo "safety-grep source failed (exit $rc)" >&2; exit 1; }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
