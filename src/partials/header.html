<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{siteHref}}" aria-label="{{a:site.homeLabel}}"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle class="bm-a" cx="9" cy="12" r="6.5"/><circle class="bm-b" cx="15" cy="12" r="6.5"/></svg><span>{{t:meta.brand}}</span></a>
    {{> editions}}
    <div class="tools">
      <a class="btn btn-secondary btn-lang" href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}" data-lang-link="{{otherLang}}"><span>{{t:meta.otherLangName}}</span><span class="vh" lang="en"> ({{t:meta.otherLangLabel}})</span></a>
      <button type="button" class="btn btn-icon btn-theme" data-theme-toggle aria-label="{{a:meta.themeToDark}}" data-label-to-dark="{{a:meta.themeToDark}}" data-label-to-light="{{a:meta.themeToLight}}">
        <svg class="ico icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="ico icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </div>
  </div>
</header>
